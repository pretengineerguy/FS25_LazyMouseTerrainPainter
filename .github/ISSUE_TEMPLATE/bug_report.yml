name: "Bug Report & Tester Feedback"
description: "Report an issue or share feedback for Lazy Mouse Terrain Painter"
title: "[FEEDBACK]: "
labels: ["tester-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test **Lazy Mouse Terrain Painter**! Please complete the sections below.

  - type: input
    id: environment
    attributes:
      label: System & Display Settings
      description: What operating system, screen resolution, and aspect ratio are you running?
      placeholder: "Windows 11, 2560x1440 (16:9)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you were painting or sculpting, and what felt wrong or glitched.
      placeholder: "e.g. While holding Left Alt and painting gravel, the brush snapped..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Game Log Snippet (log.txt)
      description: Paste any Error or Warning lines from Documents/My Games/FarmingSimulator2025/log.txt (if applicable).
      render: text
